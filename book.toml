[book]
authors = ["Eugene Yokota"]
language = "en"
multilingual = false
src = "src/reference"
title = "The Book of sbt"

[output.html]
theme = "theme"
default-theme = "light"
additional-css = [
  "src/reference/custom-202602.css",
  "src/reference/mdbook-admonish.css",
  "theme/language-picker.css"
]
cname = "www.scala-sbt.org"

[preprocessor.variables]

[preprocessor.variables.variables]
sbt_version = "2.0.0-RC12"
sbt_runner_version = "1.12.11"
scala3_example_version = "3.8.3"
scala3_metabuild_version = "3.8.3"
scala2_13_example_version = "2.13.18"
scala2_12_example_version = "2.12.21"
example_munit_version = "1.2.0"
curly_open = "{{"
curly_close = "}}"
global_base="$HOME/.sbt/2"

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.0.2" # do not edit: managed by `mdbook-admonish install`

[preprocessor.gettext]
before = ["admonish"]
after = ["links"]

[build]
extra-watch-dirs = ["po"]
